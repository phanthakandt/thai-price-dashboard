# เพิ่มหุ้นนอกรายการ: เปิด issue ชื่อ "เพิ่มหุ้น: XXX" (เฉพาะเจ้าของ repo) แล้วระบบจะเพิ่มลง watchlist.json และอัปเดตเว็บ
name: Add stock to watchlist

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  add:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'เพิ่มหุ้น')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: add
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node scripts/add-stock.mjs
      - if: steps.add.outputs.added != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlist.json
          git commit -m "เพิ่มหุ้น ${{ steps.add.outputs.added }} เข้ารายการวิเคราะห์"
          git push
          gh workflow run update.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh issue close "$NUM" --comment "$MSG"
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          MSG: ${{ steps.add.outputs.message }}
